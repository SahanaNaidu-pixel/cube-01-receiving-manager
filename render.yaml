services:
  - type: web
    name: receiving-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      # JSON map of operator keys (see .env.example). Render asks for it when the Blueprint is created.
      - key: RECEIVING_API_KEYS
        sync: false
      - key: RECEIVING_SEAL_KEY
        generateValue: true
      # Update if Render assigns the frontend a different URL.
      - key: CORS_ALLOWED_ORIGINS
        value: https://receiving-manager-web.onrender.com

  - type: web
    name: receiving-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && VITE_API_BASE_URL=https://$API_HOST npm run build
    staticPublishPath: dist
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: receiving-manager-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
